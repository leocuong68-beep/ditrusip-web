# Build web tĩnh từ Supabase và đưa lên GitHub Pages.
# Chạy khi đẩy code, 05:00 và 06:00 UTC mỗi ngày (sau giờ đăng bài 7:47 giờ Síp), bấm tay, hoặc khi có bài mới (repository_dispatch "content-updated").
name: Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5,6 * * *'   # ~8:00 giờ Síp cả giờ hè (UTC+3) lẫn giờ đông (UTC+2), sau bài 7:47
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
