# Build web tĩnh từ Supabase và đưa lên GitHub Pages + Cloudflare Pages (đang chuyển sang Cloudflare, sếp duyệt 26/10/2026).
# Cloudflare chỉ chạy khi đã có secret CLOUDFLARE_API_TOKEN và biến CLOUDFLARE_ACCOUNT_ID.
# Chạy khi đẩy code, 05:00 và 06:00 UTC mỗi ngày (sau giờ đăng bài 7:47 giờ Síp), bấm tay, hoặc khi có bài mới (repository_dispatch "content-updated").
name: Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5,6 * * *'   # ~8:00 giờ Síp cả giờ hè (UTC+3) lẫn giờ đông (UTC+2), sau bài 7:47
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  deploy_cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Kiểm tra cấu hình Cloudflare
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Chưa có token/account Cloudflare, bỏ qua."; fi
      - if: steps.cf.outputs.ok == '1'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - if: steps.cf.outputs.ok == '1'
        run: |
          npx --yes wrangler@4 pages project create ditrusip --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name=ditrusip --branch=main --commit-dirty=true
